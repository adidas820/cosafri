<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111318" />
  <meta name="description" content="Organiza tus asignaturas y practica con tests basados en tus apuntes." />
  <title>Cuaderno — Tu espacio de estudio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#inicio" aria-label="Cuaderno, inicio"><span class="brand-mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 7.5A3.5 3.5 0 0 1 11.5 4H25v21H11.5A3.5 3.5 0 0 0 8 28V7.5Z"/><path d="M8 8h12M12 12h8M8 25.5A3.5 3.5 0 0 1 11.5 22H25"/></svg></span><span>cuaderno<span class="brand-dot">.</span></span></a>
      <div class="sidebar-label">ESPACIO DE ESTUDIO</div>
      <nav class="main-nav" aria-label="Navegación principal">
        <a href="#inicio" class="nav-link active" id="nav-home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3.5 10 8.5-7 8.5 7v10.5h-6v-7h-5v7h-6V10Z"/></svg><span>Inicio</span></a>
        <a href="#asignaturas" class="nav-link" id="nav-subjects"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5h7l2 2h9v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 10h18"/></svg><span>Asignaturas</span><span class="nav-count" id="subject-count">0</span></a>
        <a href="#tests" class="nav-link" id="nav-tests"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h11v17H5V4h3Z"/><path d="M9 4V2h6v2M8 9h8M8 13h3m2 0h3M8 17h2"/></svg><span>Tests</span></a>
      </nav>
      <div class="sidebar-label subject-label">MIS ASIGNATURAS</div>
      <div class="subject-list" id="subject-list"></div>
      <div class="sidebar-bottom"><div class="privacy-note"><span class="lock-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg></span><div><strong>Biblioteca del curso</strong><span>Contenido organizado desde el repositorio.</span></div></div><button class="profile profile-button" id="open-profile" type="button" aria-label="Abrir perfil"><span class="avatar profile-initial">E</span><span class="profile-info"><strong id="sidebar-profile-name">Mi espacio</strong><span>Perfil local</span></span><span class="online-dot"></span></button></div>
    </aside>
    <main class="main-content">
      <header class="topbar"><div class="breadcrumb"><span>Mi espacio</span><span class="crumb-slash">/</span><strong id="breadcrumb-current">Inicio</strong></div><div class="top-actions"><span class="today-label" id="today-label"></span><button class="theme-toggle" id="theme-toggle" type="button" aria-label="Cambiar a tema claro"><span class="theme-toggle-icon" aria-hidden="true">☀</span><span class="theme-toggle-label">Tema claro</span></button><button class="avatar top-avatar profile-open-top profile-initial" id="open-profile-top" type="button" aria-label="Abrir perfil">E</button></div></header>
      <div class="page-content" id="page-content" aria-live="polite"></div>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal-backdrop" id="profile-modal" hidden>
    <section class="profile-modal panel" role="dialog" aria-modal="true" aria-labelledby="profile-title">
      <button class="modal-close" id="close-profile" type="button" aria-label="Cerrar perfil">×</button>
      <p class="eyebrow">TU ESPACIO PERSONAL</p><h2 id="profile-title">Perfil de estudiante</h2>
      <label class="profile-name-field">Nombre<input id="profile-name-input" type="text" maxlength="40" autocomplete="name" placeholder="¿Cómo te llamas?"></label>
      <div class="profile-stats" id="profile-stats"></div>
      <p class="profile-local-note">El nombre y el historial se guardan solo en este navegador.</p>
      <button class="primary-button" id="save-profile" type="button">Guardar perfil</button>
    </section>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
